name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          mkdir -p android-project
          unzip -q VISIT-KOLWEZI-GITHUB-COMPILATION-PACK.zip -d extracted
          cp -a extracted/VISIT-KOLWEZI-Android/. android-project/

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 OK"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler VISIT KOLWEZI
        working-directory: android-project
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Préparer APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk VISIT-KOLWEZI.apk

      - name: Donner l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI
          path: VISIT-KOLWEZI.apk
