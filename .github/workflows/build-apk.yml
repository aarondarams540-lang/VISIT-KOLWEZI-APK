name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le fichier ZIP
        run: |
          set -eux
          echo "Fichiers présents dans le dépôt :"
          ls -lah
          test -f VISIT-KOLWEZI-GITHUB-COMPILATION-PACK-CORRIGE-FINAL-V2.zip

      - name: Extraire le projet Android
        run: |
          set -eux
          rm -rf extracted android-project
          mkdir -p extracted android-project

          unzip -q VISIT-KOLWEZI-GITHUB-COMPILATION-PACK-CORRIGE-FINAL-V2.zip -d extracted

          echo "Contenu extrait :"
          find extracted -maxdepth 3 -type f | sort

          test -f extracted/VISIT-KOLWEZI-Android/settings.gradle

          cp -a extracted/VISIT-KOLWEZI-Android/. android-project/

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier Android SDK 35
        run: |
          set -eux
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Vérifier le projet Android
        working-directory: android-project
        run: |
          set -eux

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/cd/visitkolwezi/app/MainActivity.java

          echo "Projet Android vérifié avec succès."

      - name: Compiler l'APK
        working-directory: android-project
        run: |
          set -eux
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier l'APK
        run: |
          set -eux
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer l'APK
        run: |
          set -eux
          cp android-project/app/build/outputs/apk/debug/app-debug.apk VISIT-KOLWEZI.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI-apk
          path: VISIT-KOLWEZI.apk
