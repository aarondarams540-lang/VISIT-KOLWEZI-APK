name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          rm -rf android-project extracted
          mkdir extracted
          unzip -q VISIT-KOLWEZI-GITHUB-COMPILATION-PACK.zip -d extracted
          cp -a extracted/VISIT-KOLWEZI-Android/. android-project/

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Compiler VISIT KOLWEZI
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
