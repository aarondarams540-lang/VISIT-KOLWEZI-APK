name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le fichier V3
        run: |
          set -eux
          test -f VISIT-KOLWEZI-GITHUB-COMPILATION-PACK-CORRIGE-FINAL-V3.zip
          echo "ZIP V3 trouvé."

      - name: Extraire le projet Android
        run: |
          set -eux
          rm -rf extracted android-project
          mkdir -p extracted android-project

          unzip -q VISIT-KOLWEZI-GITHUB-COMPILATION-PACK-CORRIGE-FINAL-V3.zip -d extracted

          test -f extracted/VISIT-KOLWEZI-Android/settings.gradle

          cp -a extracted/VISIT-KOLWEZI-Android/. android-project/

          echo "Projet extrait avec succès."

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier Android SDK 35
        run: |
          set -eux
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 trouvé."

      - name: Vérifier le projet
        working-directory: android-project
        run: |
          set -eux
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/cd/visitkolwezi/app/MainActivity.java
          test -f app/src/main/res/values/styles.xml
          echo "Tous les fichiers nécessaires sont présents."

      - name: Compiler l'APK
        working-directory: android-project
        run: |
          set -eux
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier l'APK
        run: |
          set -eux
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          echo "APK créé avec succès."

      - name: Préparer l'APK
        run: |
          set -eux
          cp android-project/app/build/outputs/apk/debug/app-debug.apk VISIT-KOLWEZI.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI-apk
          path: VISIT-KOLWEZI.apk
